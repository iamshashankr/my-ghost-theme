name: Sync Lists

# Once a day, refresh the Lists page: latest watches from the public Letterboxd
# diary feed, and Apple Music previews for the artists. Deploys only when something changed.
on:
  schedule:
    - cron: '17 1 * * *'   # 06:47 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the diary feed
        continue-on-error: true
        run: python scripts/letterboxd.py

      - name: Refresh Apple Music previews
        continue-on-error: true
        run: python scripts/apple_music.py

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- partials/lists-films.hbs partials/lists-artists.hbs; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Shashank R"
          git config user.email "iamshashankr@users.noreply.github.com"
          git add partials/lists-films.hbs partials/lists-artists.hbs
          git commit -m "Lists: daily refresh (Letterboxd, Apple Music)"
          git push
          gh workflow run deploy-theme.yml --ref main
